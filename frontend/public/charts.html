<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagramme - Buchhaltung</title>
  <link rel="stylesheet" href="/css/style-system.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <nav class="app-nav">
      <div class="app-nav-brand">Buchhaltung</div>
      <ul class="app-nav-menu" id="nav-menu"></ul>
      <button class="btn btn-secondary btn-small" onclick="logout()">Abmelden</button>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h1>Kategorien-Diagramm</h1>
      <div style="margin-bottom: var(--space-24);">
        <label for="month-select" class="form-label">Monat:</label>
        <input type="month" id="month-select" class="form-control" style="width: 200px;">
      </div>

      <div id="alert-container"></div>
      <div id="chart-container" style="max-width: 600px; margin: 0 auto;">
        <canvas id="pie-chart"></canvas>
      </div>
      <div id="legend-container" style="margin-top: var(--space-24);"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/charts.js"></script>
</body>
</html>
