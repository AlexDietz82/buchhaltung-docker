<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategorien - Buchhaltung</title>
  <link rel="stylesheet" href="/css/style-system.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
  <header class="app-header">
    <nav class="app-nav">
      <div class="app-nav-brand">Buchhaltung</div>
      <ul class="app-nav-menu" id="nav-menu"></ul>
      <button class="btn btn-secondary btn-small" onclick="logout()">Abmelden</button>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h1>Kategorienverwaltung</h1>
      <div id="alert-container"></div>
      <div id="categories-list"></div>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header"><h2 id="modal-title">Kategorie bearbeiten</h2></div>
      <div class="modal-body">
        <form id="category-form">
          <input type="hidden" id="category-id">
          <div class="form-group">
            <label class="form-label" for="label">Bezeichnung *</label>
            <input type="text" id="label" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="color">Farbe *</label>
            <input type="color" id="color" class="form-control" required>
          </div>
          <div class="form-group">
            <label><input type="checkbox" id="active" checked> Aktiv</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
        <button class="btn btn-primary" onclick="saveCategory()">Speichern</button>
      </div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/categories.js"></script>
</body>
</html>
